<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eleganza — Orders</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{lux:{bg:"#070B14",ink:"#0B1222",ink2:"#0E1830",gold:"#D4AF37",gold2:"#F3D37A",champ:"#F7E7CE",text:"#ECE7DD",mut:"#A9B0BE"}},fontFamily:{display:['"Playfair Display"','serif'],serif:['"Cormorant Garamond"','serif'],sans:['Inter','sans-serif']}}}}</script>
<style> body{background:#070B14}.glass{background:linear-gradient(160deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02));backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,0.16)}
 .label{letter-spacing:.34em}.glow{background:radial-gradient(60% 40% at 50% 0%,rgba(212,175,55,0.1),transparent 60%)}
 .tab-on{color:#F7E7CE;border-bottom:1px solid #D4AF37}.tab{color:#A9B0BE}
 @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head>
<body class="font-sans text-lux-text antialiased">
<div class="glow fixed inset-0 pointer-events-none"></div>
<header class="relative z-20 border-b border-white/8"><div class="max-w-screen-2xl mx-auto px-8 h-20 grid grid-cols-3 items-center">
  <nav class="flex items-center gap-9 text-[11px] label uppercase"><a class="text-lux-text" href="#">Home</a><a class="text-lux-text" href="#">Shop</a><a class="text-lux-text" href="#">Scent Quiz</a></nav>
  <a href="#" class="text-center font-display text-2xl lg:text-[28px] tracking-[0.3em] text-white">GÉRAIN&nbsp;CHAN</a>
  <div class="flex items-center justify-end gap-7 text-lux-text"><span class="text-[11px] label uppercase text-lux-gold2">Account</span></div>
</div></header>
<main class="relative z-10 max-w-5xl mx-auto px-8 py-14">
  <h1 class="font-display text-5xl text-white mb-2">My Orders</h1>
  <p class="font-serif italic text-xl text-lux-champ/70 mb-8">Your history with the house.</p>
  <div class="flex items-center gap-8 text-[11px] label uppercase mb-8 border-b border-white/8 pb-px">
    <span class="tab-on pb-3">All</span><span class="tab pb-3">To Pay</span><span class="tab pb-3">To Ship</span><span class="tab pb-3">Completed</span>
  </div>
  <div class="space-y-5">
    <div class="glass rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4"><div><p class="label uppercase text-[10px] text-lux-mut">Order #ELZ-1042</p><p class="text-sm text-lux-mut mt-1">24 Jun 2026</p></div>
        <span class="px-4 py-1.5 rounded-full text-[10px] label uppercase border border-lux-gold/30 text-lux-gold2">Shipped</span></div>
      <div class="flex items-center gap-4">
        <div class="w-14 h-16 rounded-lg overflow-hidden bg-lux-ink2"><img src="https://storage.googleapis.com/eleganza-ar-media-439528178601/products/cards/ChatGPT_Image_Jun_13_2025_10_33_35_PM_v4zgvl" class="w-full h-full object-cover"/></div>
        <div class="flex-1"><p class="font-display text-xl text-white">Eleganza + 1 more</p><p class="text-xs text-lux-mut">2 items</p></div>
        <span class="font-serif text-2xl text-lux-champ">RM 348.90</span>
        <button class="px-6 py-2.5 rounded-full text-[10px] label uppercase border border-lux-gold/40 text-lux-champ hover:bg-lux-gold/10 transition">Track</button>
      </div>
    </div>
    <div class="glass rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4"><div><p class="label uppercase text-[10px] text-lux-mut">Order #ELZ-1031</p><p class="text-sm text-lux-mut mt-1">11 Jun 2026</p></div>
        <span class="px-4 py-1.5 rounded-full text-[10px] label uppercase border border-white/15 text-lux-mut">Completed</span></div>
      <div class="flex items-center gap-4">
        <div class="w-14 h-16 rounded-lg overflow-hidden bg-lux-ink2"><img src="https://storage.googleapis.com/eleganza-ar-media-439528178601/products/cards/562705c8-58b3-48c4-a7d8-1baf1469b8ed_otdwt5" class="w-full h-full object-cover"/></div>
        <div class="flex-1"><p class="font-display text-xl text-white">Project M</p><p class="text-xs text-lux-mut">1 item</p></div>
        <span class="font-serif text-2xl text-lux-champ">RM 169.00</span>
        <button class="px-6 py-2.5 rounded-full text-[10px] label uppercase border border-lux-gold/40 text-lux-champ hover:bg-lux-gold/10 transition">Rate</button>
      </div>
    </div>
  </div>
</main>
</body></html>
