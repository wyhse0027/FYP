<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eleganza — Checkout</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{lux:{bg:"#070B14",ink:"#0B1222",ink2:"#0E1830",gold:"#D4AF37",gold2:"#F3D37A",champ:"#F7E7CE",text:"#ECE7DD",mut:"#A9B0BE"}},fontFamily:{display:['"Playfair Display"','serif'],serif:['"Cormorant Garamond"','serif'],sans:['Inter','sans-serif']}}}}</script>
<style>
 body{background:#070B14}.glass{background:linear-gradient(160deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02));backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,0.16)}
 .label{letter-spacing:.34em}.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.4),transparent)}.glow{background:radial-gradient(60% 40% at 50% 0%,rgba(212,175,55,0.1),transparent 60%)}
 .fld{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1)}.fld:focus{border-color:rgba(212,175,55,0.6);background:rgba(255,255,255,0.07)}
 .btn{position:relative;overflow:hidden;color:#070B14;background:linear-gradient(110deg,#D4AF37,#F3D37A 45%,#D4AF37);background-size:220% 100%;animation:pan 7s linear infinite}
 .btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,0.7),transparent);transform:skewX(-20deg)}.btn:hover::after{animation:sweep .9s ease}
 @keyframes pan{0%{background-position:0 0}100%{background-position:220% 0}}@keyframes sweep{0%{left:-70%}100%{left:130%}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.btn::after{display:none}}
</style></head>
<body class="font-sans text-lux-text antialiased">
<div class="glow fixed inset-0 pointer-events-none"></div>
<header class="relative z-20 border-b border-white/8"><div class="max-w-screen-2xl mx-auto px-8 h-20 flex items-center justify-center">
  <a href="#" class="font-display text-2xl lg:text-[28px] tracking-[0.3em] text-white">GÉRAIN&nbsp;CHAN</a></div></header>

<main class="relative z-10 max-w-screen-2xl mx-auto px-8 py-12">
  <div class="flex items-center gap-4 text-[11px] label uppercase mb-10">
    <span class="text-lux-gold2">Bag</span><span class="text-lux-mut">—</span><span class="text-lux-gold2">Details</span><span class="text-lux-mut">—</span><span class="text-lux-mut">Confirmation</span>
  </div>
  <div class="grid lg:grid-cols-3 gap-12">
    <div class="lg:col-span-2 space-y-10">
      <div>
        <h2 class="font-display text-3xl text-white mb-6">Contact &amp; Delivery</h2>
        <div class="grid sm:grid-cols-2 gap-5">
          <div class="sm:col-span-2"><label class="block text-[11px] label uppercase text-lux-mut mb-2">Email</label><input class="fld w-full h-13 px-4 py-3.5 rounded-xl text-white outline-none transition" value="aisha@example.com"/></div>
          <div><label class="block text-[11px] label uppercase text-lux-mut mb-2">First name</label><input class="fld w-full px-4 py-3.5 rounded-xl text-white outline-none transition" value="Aisha"/></div>
          <div><label class="block text-[11px] label uppercase text-lux-mut mb-2">Last name</label><input class="fld w-full px-4 py-3.5 rounded-xl text-white outline-none transition" value="Rahman"/></div>
          <div class="sm:col-span-2"><label class="block text-[11px] label uppercase text-lux-mut mb-2">Address</label><input class="fld w-full px-4 py-3.5 rounded-xl text-white outline-none transition" value="Lot 1-59, Suria Sabah"/></div>
          <div><label class="block text-[11px] label uppercase text-lux-mut mb-2">City</label><input class="fld w-full px-4 py-3.5 rounded-xl text-white outline-none transition" value="Kota Kinabalu"/></div>
          <div><label class="block text-[11px] label uppercase text-lux-mut mb-2">Postal code</label><input class="fld w-full px-4 py-3.5 rounded-xl text-white outline-none transition" value="88000"/></div>
        </div>
      </div>
      <div>
        <h2 class="font-display text-3xl text-white mb-6">Payment</h2>
        <div class="glass rounded-2xl p-6 space-y-5">
          <div><label class="block text-[11px] label uppercase text-lux-mut mb-2">Card number</label><input class="fld w-full px-4 py-3.5 rounded-xl text-white outline-none transition" value="4242 4242 4242 4242"/></div>
          <div class="grid grid-cols-2 gap-5"><div><label class="block text-[11px] label uppercase text-lux-mut mb-2">Expiry</label><input class="fld w-full px-4 py-3.5 rounded-xl text-white outline-none transition" value="08 / 28"/></div><div><label class="block text-[11px] label uppercase text-lux-mut mb-2">CVC</label><input class="fld w-full px-4 py-3.5 rounded-xl text-white outline-none transition" value="•••"/></div></div>
        </div>
      </div>
    </div>
    <div class="glass rounded-3xl p-8 h-fit">
      <h3 class="font-display text-2xl text-white mb-6">Order Summary</h3>
      <div class="space-y-4 mb-6">
        <div class="flex items-center gap-4"><div class="w-14 h-16 rounded-lg overflow-hidden bg-lux-ink2 shrink-0"><img src="https://storage.googleapis.com/eleganza-ar-media-439528178601/products/cards/ChatGPT_Image_Jun_13_2025_10_33_35_PM_v4zgvl" class="w-full h-full object-cover"/></div><div class="flex-1"><p class="font-display text-lg text-white">Eleganza</p><p class="text-xs text-lux-mut">Qty 1</p></div><span class="font-serif text-lg text-lux-champ">RM 199.90</span></div>
        <div class="flex items-center gap-4"><div class="w-14 h-16 rounded-lg overflow-hidden bg-lux-ink2 shrink-0"><img src="https://storage.googleapis.com/eleganza-ar-media-439528178601/products/cards/4e95fbc1-d3d4-468d-b96a-f05b0c3a07b8_hcayoq" class="w-full h-full object-cover"/></div><div class="flex-1"><p class="font-display text-lg text-white">Project K</p><p class="text-xs text-lux-mut">Qty 1</p></div><span class="font-serif text-lg text-lux-champ">RM 149.00</span></div>
      </div>
      <div class="rule my-5"></div>
      <div class="flex justify-between items-baseline mb-8"><span class="label uppercase text-[11px] text-lux-mut">Total</span><span class="font-display text-3xl text-white">RM 348.90</span></div>
      <button class="btn w-full py-4 rounded-full text-[12px] font-medium label uppercase">Place Order</button>
    </div>
  </div>
</main>
</body></html>
