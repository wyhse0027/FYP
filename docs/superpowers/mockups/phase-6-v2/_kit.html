<!-- Shared design kit reference (tokens, fonts, components) for phase-6-v2 mockups.
     Each page inlines the same <head> block below. -->
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors:{ lux:{ bg:"#070B14", ink:"#0B1222", ink2:"#0E1830", line:"#1C2740",
    gold:"#D4AF37", gold2:"#F3D37A", champ:"#F7E7CE", text:"#ECE7DD", mut:"#A9B0BE" } },
  fontFamily:{ display:['"Playfair Display"','serif'], serif:['"Cormorant Garamond"','serif'], sans:['Inter','sans-serif'] },
  boxShadow:{ lux:"0 30px 80px -20px rgba(0,0,0,0.7)", gold:"0 0 0 1px rgba(212,175,55,0.18),0 28px 70px -24px rgba(0,0,0,0.7)" },
} } }
</script>
<style>
  html{scroll-behavior:smooth} body{background:#070B14}
  .glass{background:linear-gradient(160deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02));backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,0.16)}
  .label{letter-spacing:.34em}
  .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.55),transparent)}
  .vrule{width:1px;background:linear-gradient(180deg,transparent,rgba(212,175,55,0.5),transparent)}
  .glow{background:radial-gradient(60% 50% at 50% 0%,rgba(212,175,55,0.13),transparent 60%)}
  .gold-text{background:linear-gradient(92deg,#F3D37A,#D4AF37 60%,#B8860B);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{position:relative;overflow:hidden;color:#070B14;background:linear-gradient(110deg,#D4AF37,#F3D37A 45%,#D4AF37);background-size:220% 100%;animation:pan 7s linear infinite;box-shadow:0 14px 40px -10px rgba(212,175,55,0.5)}
  .btn:hover{filter:brightness(1.05)}
  .btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,0.7),transparent);transform:skewX(-20deg)}
  .btn:hover::after{animation:sweep .9s ease}
  .ghost{border:1px solid rgba(212,175,55,0.45);color:#F7E7CE}
  .ghost:hover{border-color:#D4AF37;background:rgba(212,175,55,0.08)}
  @keyframes pan{0%{background-position:0 0}100%{background-position:220% 0}}
  @keyframes sweep{0%{left:-70%}100%{left:130%}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.btn::after{display:none}}
</style>
</head>
