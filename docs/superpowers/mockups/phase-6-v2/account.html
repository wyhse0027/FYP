<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eleganza — Account</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{lux:{bg:"#070B14",ink:"#0B1222",ink2:"#0E1830",gold:"#D4AF37",gold2:"#F3D37A",champ:"#F7E7CE",text:"#ECE7DD",mut:"#A9B0BE"}},fontFamily:{display:['"Playfair Display"','serif'],serif:['"Cormorant Garamond"','serif'],sans:['Inter','sans-serif']}}}}</script>
<style>
 body{background:#070B14}.glass{background:linear-gradient(160deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02));backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,0.16)}
 .label{letter-spacing:.34em}.glow{background:radial-gradient(60% 40% at 50% 0%,rgba(212,175,55,0.1),transparent 60%)}
 .item{transition:.3s}.item:hover{border-color:rgba(212,175,55,0.4);background:rgba(255,255,255,0.05)}
 @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body class="font-sans text-lux-text antialiased">
<div class="glow fixed inset-0 pointer-events-none"></div>
<header class="relative z-20 border-b border-white/8"><div class="max-w-screen-2xl mx-auto px-8 h-20 grid grid-cols-3 items-center">
  <nav class="flex items-center gap-9 text-[11px] label uppercase"><a class="text-lux-text" href="#">Home</a><a class="text-lux-text" href="#">Shop</a><a class="text-lux-text" href="#">Scent Quiz</a></nav>
  <a href="#" class="text-center font-display text-2xl lg:text-[28px] tracking-[0.3em] text-white">GÉRAIN&nbsp;CHAN</a>
  <div class="flex items-center justify-end gap-7 text-lux-text"><span class="text-[11px] label uppercase text-lux-gold2">Account</span></div>
</div></header>

<main class="relative z-10 max-w-screen-2xl mx-auto px-8 py-14">
  <div class="grid lg:grid-cols-3 gap-10">
    <div class="glass rounded-3xl p-8 text-center">
      <div class="w-40 h-40 mx-auto rounded-full overflow-hidden border border-lux-gold/40 mb-6"><img src="https://i.pravatar.cc/300?img=32" class="w-full h-full object-cover"/></div>
      <h2 class="font-display text-3xl text-white">Aisha Rahman</h2>
      <p class="text-sm text-lux-mut mt-1">aisha@example.com</p>
      <div class="mt-6 inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-lux-gold/30 text-[10px] label uppercase text-lux-gold2">Maison Member</div>
    </div>
    <div class="lg:col-span-2">
      <h1 class="font-display text-5xl text-white mb-2">My Account</h1>
      <p class="font-serif italic text-xl text-lux-champ/70 mb-8">Everything in one place.</p>
      <div class="grid sm:grid-cols-3 gap-5">
        <a href="#" class="item glass rounded-2xl p-6"><div class="w-12 h-12 rounded-xl bg-lux-gold/10 border border-lux-gold/25 flex items-center justify-center mb-4 text-lux-gold2"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h2l2.4 12.3a2 2 0 0 0 2 1.7h7.7a2 2 0 0 0 2-1.6L22 8H6"/></svg></div><p class="font-display text-xl text-white">My Orders</p><p class="text-xs text-lux-mut mt-1">Track and manage orders</p></a>
        <a href="#" class="item glass rounded-2xl p-6"><div class="w-12 h-12 rounded-xl bg-lux-gold/10 border border-lux-gold/25 flex items-center justify-center mb-4 text-lux-gold2"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div><p class="font-display text-xl text-white">Edit Profile</p><p class="text-xs text-lux-mut mt-1">Update your details</p></a>
        <a href="#" class="item glass rounded-2xl p-6"><div class="w-12 h-12 rounded-xl bg-lux-gold/10 border border-lux-gold/25 flex items-center justify-center mb-4 text-lux-gold2"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L16 2H8l-.8 2.9a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L3 10a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1L8 22h8l.8-2.9a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6c.1-.3.1-.7.1-1z"/></svg></div><p class="font-display text-xl text-white">Settings</p><p class="text-xs text-lux-mut mt-1">Security &amp; preferences</p></a>
      </div>
      <div class="glass rounded-2xl p-6 mt-5 flex items-center justify-between">
        <div><p class="font-display text-xl text-white">Sign out</p><p class="text-xs text-lux-mut mt-1">End your session on this device</p></div>
        <button class="px-7 py-3 rounded-full text-[11px] label uppercase border border-red-500/50 text-red-300 hover:bg-red-500/10 transition">Log Out</button>
      </div>
    </div>
  </div>
</main>
<footer class="relative z-10 border-t border-white/8 mt-10"><div class="max-w-screen-2xl mx-auto px-8 py-10 text-center text-[10px] label uppercase text-lux-mut">© 2026 Gérain Chan</div></footer>
</body></html>
