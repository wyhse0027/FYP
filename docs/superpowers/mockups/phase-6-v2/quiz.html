<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eleganza — Scent Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{lux:{bg:"#070B14",ink:"#0B1222",ink2:"#0E1830",gold:"#D4AF37",gold2:"#F3D37A",champ:"#F7E7CE",text:"#ECE7DD",mut:"#A9B0BE"}},fontFamily:{display:['"Playfair Display"','serif'],serif:['"Cormorant Garamond"','serif'],sans:['Inter','sans-serif']}}}}</script>
<style>
 body{background:#070B14}
 .glass{background:linear-gradient(160deg,rgba(255,255,255,0.055),rgba(255,255,255,0.02));backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,0.16)}
 .label{letter-spacing:.34em}.glow{background:radial-gradient(60% 50% at 50% 0%,rgba(212,175,55,0.14),transparent 60%)}
 .opt{border:1px solid rgba(247,231,206,0.18);transition:.3s}.opt:hover{border-color:rgba(212,175,55,0.5)}
 .opt-on{border-color:rgba(212,175,55,0.8);background:rgba(212,175,55,0.12)}
 .btn{position:relative;overflow:hidden;color:#070B14;background:linear-gradient(110deg,#D4AF37,#F3D37A 45%,#D4AF37);background-size:220% 100%;animation:pan 7s linear infinite}
 .btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,0.7),transparent);transform:skewX(-20deg)}.btn:hover::after{animation:sweep .9s ease}
 @keyframes pan{0%{background-position:0 0}100%{background-position:220% 0}}@keyframes sweep{0%{left:-70%}100%{left:130%}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.btn::after{display:none}}
</style></head>
<body class="font-sans text-lux-text antialiased">
<div class="glow fixed inset-0 pointer-events-none"></div>
<header class="relative z-20 border-b border-white/8"><div class="max-w-screen-2xl mx-auto px-8 h-20 grid grid-cols-3 items-center">
  <nav class="flex items-center gap-9 text-[11px] label uppercase"><a class="text-lux-text" href="#">Home</a><a class="text-lux-text" href="#">Shop</a><a class="text-lux-gold2" href="#">Scent Quiz</a></nav>
  <a href="#" class="text-center font-display text-2xl lg:text-[28px] tracking-[0.3em] text-white">GÉRAIN&nbsp;CHAN</a>
  <div class="flex items-center justify-end gap-7 text-lux-text"><span class="text-[11px] label uppercase">Releases</span></div>
</div></header>

<main class="relative z-10 max-w-3xl mx-auto px-8 py-16 text-center">
  <p class="label uppercase text-[11px] text-lux-gold/85 mb-4">The Atelier</p>
  <h1 class="font-display text-5xl sm:text-6xl text-white mb-4">Discover Your<br>Signature Scent</h1>
  <p class="font-serif italic text-2xl text-lux-champ/75 mb-10">Six questions, composed into one fragrance.</p>

  <div class="flex items-center gap-3 mb-3 max-w-md mx-auto">
    <span class="text-[10px] label uppercase text-lux-mut">02 / 06</span>
    <div class="flex-1 h-1 rounded-full bg-white/8 overflow-hidden"><div class="h-full w-1/3 rounded-full bg-gradient-to-r from-lux-gold to-lux-gold2"></div></div>
  </div>

  <div class="glass rounded-3xl p-8 sm:p-12 mt-8 text-left">
    <p class="label uppercase text-[11px] text-lux-gold/80 mb-3">Question 02</p>
    <h2 class="font-display text-3xl sm:text-4xl text-white mb-8">Which mood calls to you tonight?</h2>
    <div class="grid sm:grid-cols-2 gap-4">
      <button class="opt-on rounded-2xl p-6 text-left flex items-center justify-between">
        <div><p class="font-serif text-2xl text-white">Bold &amp; Magnetic</p><p class="text-sm text-lux-mut mt-1">Oud, leather, spice</p></div>
        <span class="w-7 h-7 rounded-full bg-lux-gold text-lux-bg flex items-center justify-center text-sm">✓</span>
      </button>
      <button class="opt rounded-2xl p-6 text-left"><p class="font-serif text-2xl text-white">Soft &amp; Romantic</p><p class="text-sm text-lux-mut mt-1">Rose, musk, powder</p></button>
      <button class="opt rounded-2xl p-6 text-left"><p class="font-serif text-2xl text-white">Fresh &amp; Bright</p><p class="text-sm text-lux-mut mt-1">Citrus, marine, green</p></button>
      <button class="opt rounded-2xl p-6 text-left"><p class="font-serif text-2xl text-white">Warm &amp; Comforting</p><p class="text-sm text-lux-mut mt-1">Vanilla, amber, wood</p></button>
    </div>
    <div class="flex items-center justify-between mt-10">
      <button class="text-[11px] label uppercase text-lux-mut hover:text-white inline-flex items-center gap-2">← Back</button>
      <button class="btn px-10 py-3.5 rounded-full text-[12px] font-medium label uppercase">Continue</button>
    </div>
  </div>
</main>
<footer class="relative z-10 border-t border-white/8 mt-10"><div class="max-w-screen-2xl mx-auto px-8 py-10 text-center text-[10px] label uppercase text-lux-mut">© 2026 Gérain Chan · Immersive Perfume · AR Experience</div></footer>
</body></html>
